<!-- =========================================================
     SLIDE 1 — COVER
     Hero = the app itself. The wardrobe tile grid becomes the
     slide's compositional system instead of a card layout.
     QR + docs live on the closing slide only — repeating them
     here made the cover carry three information blocks.
     ========================================================= -->
<section class="slide" data-cat="0">
    <div class="cv-mosaic">
        <div class="tile t-a"></div>
        <div class="tile t-b"><span class="tg">knit</span></div>
        <div class="tile t-c"></div>
        <div class="tile t-d"></div>
        <div class="tile t-e"><span class="tg">boots</span></div>
        <div class="tile t-f"></div>
        <div class="tile t-g"><span class="tg">scarf</span></div>
    </div>
    <div class="cv-shot"><img src="{{IMG:wardrobe-main.png}}" alt="옷장 메인 화면"></div>

    <div class="cv-left">
        <div class="cv-kick rv d1">DIGITAL WARDROBE · PORTFOLIO</div>
        <div class="cv-name rv d1"><span class="ph">PLACEHOLDER: 프로젝트명<span class="ph-tag">추후 업데이트</span></span></div>
        <h1 class="cv-h1 rv d2">
            <span class="l1">AI 오케스트레이션 기반</span>
            <span class="l2"><span class="mk">1인 풀스택</span> 앱 개발</span>
        </h1>
        <p class="cv-lead rv d3">가진 것과 입은 것을 기록하는 디지털 옷장.<br>기획부터 릴리즈까지 서브에이전트 파이프라인으로 운영했다.</p>
        <div class="cv-index rv d4">
            {{TOC}}
        </div>
    </div>

    <dl class="cv-glass rv d5">
        <div class="g"><dt>제작자</dt><dd><span class="ph">PLACEHOLDER: 이름</span></dd></div>
        <div class="g"><dt>개발기간</dt><dd><span class="ph">PLACEHOLDER: 개발기간</span></dd></div>
        <div class="g"><dt>Core Tool</dt><dd>Claude Code</dd></div>
    </dl>
</section>
